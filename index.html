<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>バイトのホンネ</title>
<link rel="icon" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon.svg">
<style>
  /* ============================================================
     スマホアプリ風の見た目。幅430pxの1カラムに寄せ、
     PC で開いたときは中央に「端末の中身」が見えるようにする
     ============================================================ */
  :root {
    --fg: #111418; --sub: #6b7280; --bg: #e9ecf1; --card: #fff;
    --line: #e6e8ec; --accent: #2b6cb0; --accent-soft: #eaf1f9;
    --keep: #1d7a4c; --keep-soft: #e6f4ec; --pass: #8a8f98; --star: #e8a91b;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
    --bar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.55; -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 端末の画面にあたる部分 */
  .app {
    max-width: 430px; margin: 0 auto; min-height: 100%;
    background: var(--card); box-shadow: 0 0 40px rgba(16,24,40,.10);
    padding-bottom: calc(var(--bar) + 32px);   /* 下の判断バーに隠れないように */
  }

  /* 上部バー（タイトル＋絞り込みまでを1つの固定ヘッダにする） */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line); padding: 12px 14px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .applogo { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .appbar h1 { font-size: 1.05rem; margin: 0; letter-spacing: .01em; }
  .appbar .tag { margin: 1px 0 0; font-size: .72rem; color: var(--sub); }
  .appbar .ask { margin: 10px 0 0; font-size: .8rem; font-weight: 700; }
  .chips {
    display: flex; gap: 8px; margin-top: 8px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: #f5f6f8; font-size: .82rem;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .chip:disabled { opacity: .35; }
  .sortline { margin: 8px 0 0; font-size: .72rem; color: var(--sub); }
  .sortline b { color: var(--accent); }

  /* 一覧 */
  .body { padding: 12px 12px 0; }
  .note { color: var(--sub); font-size: .72rem; margin: 0 2px 10px; }
  h3 { font-size: .72rem; margin: 14px 0 6px; color: var(--sub); font-weight: 700; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
  }
  .card.open { border-color: #c9dcf0; box-shadow: 0 2px 10px rgba(43,108,176,.13); }
  .card-head {
    display: flex; gap: 10px; align-items: center; width: 100%;
    padding: 12px; background: none; border: 0; text-align: left;
  }
  .card-head:active { background: #f6f7f9; }
  .thumb { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 12px; display: block; }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-weight: 700; font-size: .95rem; }
  .card-meta { font-size: .72rem; color: var(--sub); margin-top: 1px; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pill { font-size: .68rem; padding: 2px 8px; border-radius: 999px; background: #f1f3f6; color: #4b5563; }
  .pill.pay { background: var(--keep-soft); color: var(--keep); font-weight: 700; }
  .score {
    flex: 0 0 auto; text-align: center; background: var(--accent-soft);
    border-radius: 12px; padding: 7px 9px; min-width: 60px;
  }
  .score .num { font-size: 1.25rem; font-weight: 800; color: var(--accent); line-height: 1.15; }
  .score .cnt { font-size: .62rem; color: var(--sub); }
  .stars { font-size: .6rem; letter-spacing: .5px; color: var(--star); }
  .stars .off { color: #dcdfe4; }
  .flag { font-size: .65rem; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .flag.keep { background: var(--keep-soft); color: var(--keep); }
  .flag.pass { background: #eceef1; color: var(--pass); }

  /* 開いたあとの中身 */
  .detail { padding: 2px 12px 12px; border-top: 1px solid var(--line); }
  .cols > div { min-width: 0; }
  .barrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: .78rem; }
  .barrow .lb { width: 7.5em; flex-shrink: 0; }
  .bar { flex: 1; height: 7px; background: #eef0f3; border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .barrow .vl { width: 2.2em; text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }
  .factrow { font-size: .78rem; margin-bottom: 4px; }
  .factrow .fl { color: var(--sub); }
  .factrow .fv { font-weight: 700; }
  .factrow .fb { color: var(--sub); font-size: .7rem; }
  .duties { margin: 0; padding-left: 1.1em; font-size: .78rem; }

  .review { border-top: 1px solid #f0f2f5; padding: 10px 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .badge { font-size: .66rem; padding: 2px 7px; border-radius: 5px; background: #f1f3f6; color: #4b5563; }
  .trust { font-size: .66rem; padding: 2px 7px; border-radius: 5px; font-weight: 700; }
  .trust.hi { background: var(--keep-soft); color: var(--keep); }
  .trust.mid { background: #fdf3e0; color: #a06a06; }
  .trust.lo { background: #eceef1; color: var(--pass); }
  .review .cmt { margin: 6px 0 0; font-size: .84rem; }
  .review .rt { margin: 4px 0 0; font-size: .68rem; color: var(--sub); }

  /* 最後に人が決めるところ */
  .decide { margin-top: 14px; padding: 12px; background: #f7f8fa; border-radius: 12px; }
  .decide p { margin: 0 0 10px; font-size: .8rem; }
  .decide .btns { display: flex; gap: 10px; }
  button.act {
    flex: 1; padding: 12px 0; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; font-weight: 700; font-size: .88rem;
  }
  button.act:active { transform: scale(.98); }
  button.act[aria-pressed="true"].keep { background: var(--keep); border-color: var(--keep); color: #fff; }
  button.act[aria-pressed="true"].pass { background: var(--pass); border-color: var(--pass); color: #fff; }

  /* 下に貼りつく「あなたの判断」 */
  .sheet {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; z-index: 30; background: #fff;
    border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 18px rgba(16,24,40,.10);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; height: var(--bar); padding: 0 16px; background: none; border: 0;
  }
  .sheet-bar .ttl { font-size: .85rem; font-weight: 700; }
  .sheet-bar .cnt { font-size: .72rem; color: var(--sub); font-weight: 400; margin-left: 8px; }
  .caret { color: var(--sub); font-size: .7rem; transition: transform .2s; }
  .sheet.open .caret { transform: rotate(180deg); }
  .sheet-body { max-height: 0; overflow: hidden; padding: 0 16px; transition: max-height .22s ease; }
  .sheet.open .sheet-body { max-height: 46vh; overflow-y: auto; padding-bottom: 16px; }
  .summary { font-size: .84rem; }
  .summary ul { margin: 4px 0 0; padding-left: 1.1em; }

  .foot { color: var(--sub); font-size: .68rem; text-align: center; padding: 8px 16px 20px; }
  .foot button { background: none; border: 0; color: var(--sub); text-decoration: underline; font-size: .68rem; padding: 4px; }
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <div class="brand">
      <img class="applogo" src="img/icon.svg" alt="">
      <div>
        <h1>バイトのホンネ</h1>
        <p class="tag">働く側の声で「自分に合うか」を決める</p>
      </div>
    </div>
    <p class="ask">何を重視する？<span style="font-weight:400;color:var(--sub)">（最大3つ）</span></p>
    <div class="chips" id="chips"></div>
    <p class="sortline" id="sortline"></p>
  </header>

  <div class="body">
    <p class="note">点数は、勤続期間が長い人の評価ほど重く数えた加重平均です。タップすると中身が開きます。</p>
    <div id="list"></div>
  </div>

  <p class="foot">
    今はバイトを探す人の画面だけです。レビューの投稿はこのあと追加します。<br>
    データはこのブラウザにだけ保存されるモックです。<br>
    <button id="reset">保存内容をリセットしてデモデータに戻す</button>
  </p>

  <!-- 人が決めた結果は、いつでも見えるように下に貼りつけておく -->
  <div class="sheet" id="sheet">
    <button class="sheet-bar" id="sheet-toggle">
      <span><span class="ttl">あなたの判断</span><span class="cnt" id="sheet-count"></span></span>
      <span class="caret">▲</span>
    </button>
    <div class="sheet-body"><div class="summary" id="summary"></div></div>
  </div>

</div>
<script>
// ============================================================
// 決めたこと（CLAUDE.md と対応）
//   ・保存は localStorage のキー 'app-data' 1つにまとめる
//   ・画面は index.html の1枚だけ
//   ・動線は1本： ①重視を選ぶ → ②並び替え → 中身を見る → ③人が決める
//   ・③ の「気になる／見送る」だけは、アプリが自動で決めない
//   ・レビューの投稿画面は後回し。項目の定義（下の定数）はそのまま残してある
// ============================================================

const STORAGE_KEY = 'app-data';

// --- 選択肢の定義 ------------------------------------------------

// 勤続期間ごとの重み。この数字が「その評価をどれだけ重く数えるか」
const TENURES = [
  { v: '2y', label: '2年以上',   w: 1.0  },
  { v: '1y', label: '1年',       w: 0.85 },
  { v: '6m', label: '半年',      w: 0.7  },
  { v: '3m', label: '3か月未満', w: 0.5  },
];
// AGE_BANDS / ROLES は今は投稿フォーム専用。投稿画面を作るときに使うので消さないこと
const AGE_BANDS = ['18-19歳', '20-22歳', '23-25歳', '26歳以上'];
const ROLES     = ['大学生', 'フリーター', '社会人'];

// バイト先の画像。外から持ってこず img/ の SVG を使う（オフラインでも出るように）
const CATEGORY_IMG = {
  'カフェ':   'img/cafe.svg',
  'コンビニ': 'img/konbini.svg',
  '塾講師':   'img/juku.svg',
  '軽作業':   'img/soko.svg',
};
const imageOf = w => w.image || CATEGORY_IMG[w.category] || 'img/other.svg';

// 事実項目。平均は取らず、そのまま並べて見せる
const FACT_FIELDS = [
  { key: 'payCycle',     label: '支払いサイクル', options: ['日払い', '週払い', '月払い'] },
  { key: 'studentRatio', label: '大学生の割合',   options: ['ほぼ全員', '半分くらい', '少数', 'ほぼいない'] },
  { key: 'hiring',       label: '募集状況',       options: ['大量募集中', '数名', '不明'] },
  { key: 'channel',      label: '応募経路',       options: ['直接応募', '求人サイト経由'] },
];

// 5段階で評価する項目
const RATING_ITEMS = [
  { key: 'talk',    label: '話しかけやすさ', hint: '同世代がいて話しかけやすいか' },
  { key: 'env',     label: '周りの環境',     hint: '設備・立地・清潔さ' },
  { key: 'hours',   label: '労働時間の負担', hint: '高いほど負担が軽い' },
  { key: 'bond',    label: '職場内の繋がり', hint: '親睦会・打ち上げ' },
  { key: 'support', label: 'サポートの手厚さ', hint: '研修・フォロー' },
  { key: 'shift',   label: 'シフトの融通',   hint: '希望が通るか' },
];
const RATING_KEYS = RATING_ITEMS.map(i => i.key);

// --- デモ用のシードデータ ----------------------------------------
// localStorage が空のときに流し込む。GitHub Pages で初めて開いた人にも中身が見える

function seed() {
  const rv = (id, workplaceId, tenure, ageBand, role, ratings, facts, duties, comment, createdAt) => ({
    id, workplaceId, createdAt,
    author: { tenure, ageBand, role },
    facts: { payCycle: facts[0], studentRatio: facts[1], hiring: facts[2], channel: facts[3], duties },
    ratings: {
      talk: ratings[0], env: ratings[1], hours: ratings[2],
      bond: ratings[3], support: ratings[4], shift: ratings[5],
    },
    comment,
  });
  return {
    workplaces: [
      { id: 'w1', name: 'カフェ・ルミエール 渋谷店',       category: 'カフェ', image: 'img/cafe.svg',   area: '渋谷' },
      { id: 'w2', name: 'まちかどマート 高田馬場店',       category: 'コンビニ', image: 'img/konbini.svg', area: '高田馬場' },
      { id: 'w3', name: '個別指導塾ステップアップ 池袋校', category: '塾講師', image: 'img/juku.svg',   area: '池袋' },
      { id: 'w4', name: '品川ピッキングセンター',          category: '軽作業', image: 'img/soko.svg',   area: '品川' },
    ],
    reviews: [
      rv('r1', 'w1', '2y', '23-25歳', '大学生', [4,4,3,4,4,3], ['月払い','半分くらい','数名','求人サイト経由'],
         'ドリンク作りとレジ、閉店後の清掃',
         'ピーク時は忙しいけど、社員さんが必ずフォローに入ってくれる。シフトは2週間ごとの提出で、テスト期間は減らしてもらえた。', '2026-06-11'),
      rv('r2', 'w1', '6m', '20-22歳', '大学生', [5,4,4,3,3,4], ['月払い','ほぼ全員','数名','求人サイト経由'],
         'ホール接客とレジ', '同い年が多くて、初日から普通に喋れた。', '2026-07-28'),
      rv('r3', 'w1', '3m', '18-19歳', '大学生', [4,3,3,2,2,3], ['月払い','半分くらい','大量募集中','直接応募'],
         'レジ', '', '2026-08-19'),

      rv('r4', 'w2', '1y', '20-22歳', 'フリーター', [3,3,4,2,3,5], ['月払い','少数','大量募集中','求人サイト経由'],
         'レジ、品出し、発注の補助', '深夜は一人なので黙々とやりたい人向け。シフトの融通はかなり利く。', '2026-05-30'),
      rv('r5', 'w2', '6m', '26歳以上', '社会人', [2,3,4,1,2,5], ['月払い','少数','大量募集中','直接応募'],
         'レジと品出し', '年齢層がバラバラで会話はほぼない。割り切れるなら楽。', '2026-07-09'),
      rv('r6', 'w2', '3m', '18-19歳', '大学生', [2,2,3,1,2,4], ['月払い','ほぼいない','大量募集中','求人サイト経由'],
         '品出し', '', '2026-08-24'),

      rv('r7', 'w3', '2y', '23-25歳', '大学生', [4,5,4,3,4,2], ['月払い','ほぼ全員','数名','求人サイト経由'],
         '中学生2名の個別指導と報告書の作成',
         'コマ以外の準備時間は給料が出ないので、時給だけ見ると印象と違う。学生講師ばかりなので話は合う。', '2026-04-16'),
      rv('r8', 'w3', '1y', '20-22歳', '大学生', [5,5,4,4,3,2], ['月払い','ほぼ全員','数名','求人サイト経由'],
         '高校生の英語指導', '飲み会が学期に一回くらいある。担当が固定なので、休むときは代講を自分で探す必要あり。', '2026-06-25'),
      rv('r9', 'w3', '6m', '20-22歳', '大学生', [4,4,5,3,2,1], ['月払い','ほぼ全員','不明','求人サイト経由'],
         '小学生の算数', '', '2026-08-02'),

      rv('r10', 'w4', '2y', '23-25歳', 'フリーター', [3,2,3,2,4,4], ['週払い','半分くらい','大量募集中','直接応募'],
         'リーダー業務と新人の指導', '長く続けると時給が上がる。あとは体力次第。', '2026-05-14'),
      rv('r11', 'w4', '1y', '20-22歳', 'フリーター', [3,2,2,1,3,5], ['日払い','半分くらい','大量募集中','求人サイト経由'],
         '棚から商品を集めて梱包',
         '当日に現金でもらえるのが一番の理由。単発で入れるので、予定が読めない月でも助かる。', '2026-07-02'),
      rv('r12', 'w4', '6m', '18-19歳', '大学生', [4,2,2,2,3,5], ['日払い','半分くらい','大量募集中','求人サイト経由'],
         'ピッキングと検品', '大学生が多くて休憩中は喋れる。ただ立ちっぱなしで、冬はかなり寒い。', '2026-08-08'),
      rv('r13', 'w4', '3m', '20-22歳', '大学生', [3,1,2,1,2,5], ['日払い','少数','大量募集中','求人サイト経由'],
         '仕分け', '', '2026-08-27'),
    ],
    focus: [],       // ① で人が選んだ、重視する項目
    decisions: {},   // ④ で人が押した結果 { workplaceId: 'keep' | 'pass' }
  };
}

// --- 保存と読み込み ----------------------------------------------

function loadData() {
  let d;
  try {
    d = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch {
    d = null;   // 壊れた値が入っていても落ちないようにする
  }
  if (!d || !Array.isArray(d.workplaces) || !d.workplaces.length) {
    d = seed();
    saveData(d);
  }
  d.focus = d.focus || [];
  d.decisions = d.decisions || {};
  return d;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// --- 集計 --------------------------------------------------------

// レビュー1件の重み。勤続期間が長いほど重く、コメントがあれば少し足す
function reviewWeight(r) {
  const t = TENURES.find(t => t.v === r.author.tenure);
  return (t ? t.w : 0.5) + (r.comment && r.comment.trim() ? 0.1 : 0);
}

// 項目1つの加重平均
function itemAvg(reviews, key) {
  let sum = 0, wsum = 0;
  for (const r of reviews) {
    const w = reviewWeight(r);
    sum += r.ratings[key] * w;
    wsum += w;
  }
  return wsum ? sum / wsum : null;
}

// 指定した項目たちの総合点。focus が空なら全項目
function overallScore(reviews, keys) {
  const vals = keys.map(k => itemAvg(reviews, k)).filter(v => v !== null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function reviewsOf(data, workplaceId) {
  return data.reviews.filter(r => r.workplaceId === workplaceId);
}

// 事実項目の内訳（多い順）
function factCounts(reviews, key) {
  const map = new Map();
  for (const r of reviews) {
    const v = r.facts[key];
    if (v) map.set(v, (map.get(v) || 0) + 1);
  }
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}

// --- 表示のための小道具 ------------------------------------------

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function starsHtml(v) {
  const n = Math.round(v);
  return '<span class="stars">' + '★'.repeat(n) +
         '<span class="off">' + '★'.repeat(5 - n) + '</span></span>';
}

function trustOf(r) {
  const w = reviewWeight(r);
  if (w >= 0.9) return { cls: 'hi',  label: '参考度 高' };
  if (w >= 0.7) return { cls: 'mid', label: '参考度 中' };
  return { cls: 'lo', label: '参考度 低' };
}

function tenureLabel(v) {
  const t = TENURES.find(t => t.v === v);
  return t ? t.label : v;
}

// ============================================================
// 画面の状態
// ============================================================

let data = loadData();
let openId = null;   // 開いているカード

// ① 重視することを選ぶ
function renderChips() {
  const box = document.getElementById('chips');
  const full = data.focus.length >= 3;
  box.innerHTML = RATING_ITEMS.map(i => {
    const on = data.focus.includes(i.key);
    return '<button class="chip" data-key="' + i.key + '" aria-pressed="' + on + '"' +
           (!on && full ? ' disabled' : '') + '>' + esc(i.label) + '</button>';
  }).join('');

  const line = document.getElementById('sortline');
  if (data.focus.length) {
    const names = data.focus.map(k => RATING_ITEMS.find(i => i.key === k).label).join('・');
    line.innerHTML = '重視：<b>' + esc(names) + '</b> で並び替え中';
  } else {
    line.textContent = '全項目の平均で並び替え中';
  }
}

// ② 一覧 → ③ 詳細 → ④ 判断
function renderList() {
  const keys = data.focus.length ? data.focus : RATING_KEYS;

  const rows = data.workplaces.map(w => {
    const rs = reviewsOf(data, w.id);
    return { w, rs, score: overallScore(rs, keys) };
  }).sort((a, b) => (b.score ?? -1) - (a.score ?? -1));

  document.getElementById('list').innerHTML = rows.map(({ w, rs, score }) => {
    const pay = factCounts(rs, 'payCycle')[0];
    const stu = factCounts(rs, 'studentRatio')[0];
    const dec = data.decisions[w.id];
    const flag = dec === 'keep' ? '<span class="flag keep">気になる</span>'
               : dec === 'pass' ? '<span class="flag pass">見送り</span>' : '';

    return '' +
    '<div class="card' + (openId === w.id ? ' open' : '') + '" data-id="' + w.id + '">' +
      '<button class="card-head" data-act="toggle">' +
        '<img class="thumb" src="' + esc(imageOf(w)) + '" alt="">' +
        '<div class="card-title">' +
          '<div class="name">' + esc(w.name) + flag + '</div>' +
          '<div class="card-meta">' + esc(w.category) + '／' + esc(w.area) + '</div>' +
          '<div class="pills">' +
            (pay ? '<span class="pill pay">' + esc(pay[0]) + '</span>' : '') +
            (stu ? '<span class="pill">大学生 ' + esc(stu[0]) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="score">' +
          '<div class="num">' + (score === null ? '—' : score.toFixed(1)) + '</div>' +
          (score === null ? '' : starsHtml(score)) +
          '<div class="cnt">' + rs.length + '件</div>' +
        '</div>' +
      '</button>' +
      (openId === w.id ? detailHtml(w, rs) : '') +
    '</div>';
  }).join('');
}

function detailHtml(w, rs) {
  const bars = RATING_ITEMS.map(i => {
    const v = itemAvg(rs, i.key);
    const on = data.focus.includes(i.key);
    return '<div class="barrow">' +
      '<span class="lb" title="' + esc(i.hint) + '"' + (on ? ' style="font-weight:700"' : '') + '>' +
        esc(i.label) + '</span>' +
      '<span class="bar"><span class="fill" style="width:' + (v === null ? 0 : v / 5 * 100) + '%"></span></span>' +
      '<span class="vl">' + (v === null ? '—' : v.toFixed(1)) + '</span>' +
    '</div>';
  }).join('');

  const facts = FACT_FIELDS.map(f => {
    const c = factCounts(rs, f.key);
    if (!c.length) return '';
    const breakdown = c.map(([v, n]) => esc(v) + ' ' + n).join(' / ');
    return '<div class="factrow"><span class="fl">' + esc(f.label) + '：</span>' +
           '<span class="fv">' + esc(c[0][0]) + '</span> ' +
           '<span class="fb">（' + breakdown + '）</span></div>';
  }).join('');

  const duties = [...new Set(rs.map(r => r.facts.duties).filter(Boolean))]
    .map(d => '<li>' + esc(d) + '</li>').join('');

  const reviews = [...rs].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
    .map(r => {
      const t = trustOf(r);
      const detail = RATING_ITEMS.map(i => i.label + ' ' + r.ratings[i.key]).join('・');
      return '<div class="review">' +
        '<div class="badges">' +
          '<span class="trust ' + t.cls + '">' + t.label + '</span>' +
          '<span class="badge">勤続 ' + esc(tenureLabel(r.author.tenure)) + '</span>' +
          '<span class="badge">' + esc(r.author.ageBand) + '</span>' +
          '<span class="badge">' + esc(r.author.role) + '</span>' +
          '<span class="badge">' + esc(r.facts.payCycle) + '</span>' +
        '</div>' +
        (r.comment && r.comment.trim() ? '<p class="cmt">' + esc(r.comment) + '</p>' : '') +
        '<p class="rt">' + esc(detail) + '　/　' + esc(r.createdAt || '') + '</p>' +
      '</div>';
    }).join('');

  const dec = data.decisions[w.id];

  return '<div class="detail">' +
    '<div class="cols">' +
      '<div>' +
        '<h3>項目別の評価</h3>' + bars +
        '<p class="note">勤続期間が長い人の評価ほど重く数えています（2年以上=1.0 → 3か月未満=0.5、コメントありは +0.1）。</p>' +
      '</div>' +
      '<div>' +
        '<h3>働き方の事実</h3>' + facts +
        '<h3>実際の業務内容</h3>' +
        (duties ? '<ul class="duties">' + duties + '</ul>' : '<p class="note">まだありません</p>') +
      '</div>' +
    '</div>' +
    '<h3>レビュー（' + rs.length + '件）</h3>' + reviews +
    '<div class="decide">' +
      '<p>点数が出せるのはここまで。<b>働くかどうかを決めるのはあなたです。</b></p>' +
      '<div class="btns">' +
        '<button class="act keep" data-act="keep" aria-pressed="' + (dec === 'keep') + '">気になる</button>' +
        '<button class="act pass" data-act="pass" aria-pressed="' + (dec === 'pass') + '">見送る</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// 人が押した結果のまとめ（下に貼りついたシートの中身）
function renderSummary() {
  const box   = document.getElementById('summary');
  const count = document.getElementById('sheet-count');
  const name  = id => (data.workplaces.find(w => w.id === id) || {}).name || id;
  const keep  = Object.keys(data.decisions).filter(k => data.decisions[k] === 'keep');
  const pass  = Object.keys(data.decisions).filter(k => data.decisions[k] === 'pass');

  if (!keep.length && !pass.length) {
    count.textContent = 'まだ決めていません';
    box.innerHTML = '<p class="note" style="margin:0">カードを開いて「気になる／見送る」を押すと、ここに残ります。</p>';
    return;
  }
  count.textContent = '気になる ' + keep.length + '・見送り ' + pass.length;
  box.innerHTML =
    (keep.length ? '<div><b>気になる（' + keep.length + '）</b><ul>' +
      keep.map(id => '<li>' + esc(name(id)) + '</li>').join('') + '</ul></div>' : '') +
    (pass.length ? '<div style="margin-top:10px"><b>見送る（' + pass.length + '）</b><ul>' +
      pass.map(id => '<li>' + esc(name(id)) + '</li>').join('') + '</ul></div>' : '');
}

function renderAll() {
  renderChips();
  renderList();
  renderSummary();
}

// ============================================================
// 操作をまとめて受ける
// ============================================================

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  const k = b.dataset.key;
  if (data.focus.includes(k)) {
    data.focus = data.focus.filter(x => x !== k);
  } else if (data.focus.length < 3) {
    data.focus.push(k);
  }
  saveData(data);
  renderAll();
});

document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.closest('.card').dataset.id;
  const act = btn.dataset.act;

  if (act === 'toggle') {
    openId = (openId === id) ? null : id;
  } else {
    // ③ 人が決める。同じボタンをもう一度押すと取り消し
    data.decisions[id] = (data.decisions[id] === act) ? undefined : act;
    if (!data.decisions[id]) delete data.decisions[id];
    saveData(data);
  }
  renderAll();
});

document.getElementById('sheet-toggle').addEventListener('click', () => {
  document.getElementById('sheet').classList.toggle('open');
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('投稿と判断をすべて消して、デモデータに戻します。よろしいですか？')) return;
  data = seed();
  saveData(data);
  openId = null;
  renderAll();
});

// ============================================================
// 起動
// ============================================================

renderAll();
</script>
</body>
</html>
